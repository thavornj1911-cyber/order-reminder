    <path d="M256 260 L256 480" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />
    <!-- Flaps -->
    <path d="M164 110 L348 210" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <path d="M348 110 L164 210" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    
    <!-- Notification Bell Badge -->
    <circle cx="390" cy="110" r="75" fill="#ef4444" stroke="#ffffff" stroke-width="10" />
    <!-- Bell Icon -->
    <path d="M390 75 C376 75 365 86 365 100 C365 125 350 135 350 135 L430 135 C430 135 415 125 415 100 C415 86 404 75 390 75 Z" fill="#ffffff" />
    <circle cx="390" cy="147" r="7" fill="#ffffff" />
